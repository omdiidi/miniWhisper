[project]
name = "wispralt"
version = "0.1.0"
description = "WisprAlt — self-hosted dictation and file-transcription server"
requires-python = ">=3.11,<4.0"
dependencies = [
    # Web framework
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "python-multipart==0.0.9",
    # Configuration
    "pydantic==2.9",
    "pydantic-settings==2.5",
    # Audio utilities
    "soundfile==0.12.1",
    # librosa>=0.11 required for numpy 2 compatibility
    "librosa>=0.11.0,<0.12.0",
    # numpy 2.x required by parakeet-mlx; <2.3 for compatibility ceiling
    "numpy>=2.0,<2.3",
    # HuggingFace — pinned for mlx-whisper model fetch (the 1.12.x line is the
    # known-good one; relax deliberately, not as a side effect).
    "huggingface_hub>=1.12.0,<1.13",
    # OOM guard (v3 delta)
    "psutil>=6.0",
    # Server-rendered admin UI templates
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
# Apple-Silicon inference stack for the Local-mode host. Install with
# `uv sync --extra host` (or `pip install -e '.[host]'`). `wispralt.main`
# imports without it (MLX is imported lazily); CI uses stubs instead.
host = [
    # ML — dictation
    "parakeet-mlx==0.5.1",
    "mlx>=0.22.1,<0.32.0",
    # ML — file transcription (torch arrives only transitively via mlx-whisper)
    "mlx-whisper==0.4.2",
]
dev = [
    "ruff==0.6.9",
    "pyright==1.1.380",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wispralt"]

# ── ruff config ───────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["E501"]  # line-length enforced by formatter

[tool.ruff.lint.isort]
known-first-party = ["wispralt"]

# ── pyright config ────────────────────────────────────────────────────────────
[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src"]
reportMissingTypeStubs = false

# ── pytest config ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
