name: Lint installer and scripts

# Fail-closed guard for install.sh. It runs on a fresh Mac under macOS's frozen
# bash 3.2 with `set -u` (an empty-array expansion once crashed the old installer
# there) and before any Python exists. macos-14 gives a free bash-3.2 runner:
# source the file (its guard stops main) and call the functions directly.

on:
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "scripts/**"
      - ".github/workflows/lint-install.yml"
  pull_request:
    paths:
      - "install.sh"
      - "scripts/**"
      - ".github/workflows/lint-install.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Confirm bash 3.2 (the frozen macOS shell)
        run: bash --version | head -1

      - name: Syntax check
        run: |
          bash -n install.sh
          for f in scripts/*.sh scripts/*/*.sh; do bash -n "$f" || exit 1; done

      - name: Sourced-function smoke (bash 3.2, set -u)
        run: |
          set -euo pipefail
          source ./install.sh
          parse_flags                       # no arguments: "$@" must be safe under set -u
          [ "$NON_INTERACTIVE" = "0" ] || { echo "::error::parse_flags set non-interactive"; exit 1; }
          parse_flags --role host --non-interactive --token-file /tmp/x
          [ "$NON_INTERACTIVE" = "1" ] || { echo "::error::parse_flags missed --non-interactive"; exit 1; }
          require_user
          require_clone
          [ -f "$CLONE/server/pyproject.toml" ] || { echo "::error::require_clone found no clone"; exit 1; }
          echo "sourced-function smoke passed"

      - name: No python3 dependency
        run: |
          if grep -n 'python3' install.sh; then
            echo "::error::python3 reintroduced into install.sh — fresh Macs lack it"
            exit 1
          fi
          echo "no python3 dependency"
